<div #map>

</div>

<section id="controls">
  <h2 class="text-2xl font-bold text-black mb-2">
    Zoom
    <small class="text-gray-500 font-normal">
    {{ zoom() | number:"1.0-0"}}
    </small>
  </h2>

  <input
    type="range"
    min="1"
    max="19"
    step="1"
    [value]="zoom()"
    class="range range-secondary"
    (input)="setZoom(txtZoom.valueAsNumber)"
    #txtZoom
  />

  <h2 class="text-2xl font-bold text-black mb-2">Coordenadas</h2>
  <p class="text-sm text-gray-500 font-normal">Latitud:  {{coordinates().lat |number:"1.4-4"}}</p>
  <p class="text-sm text-gray-500 font-normal">Longitud: {{coordinates().lng |number:"1.4-4"}}</p>
</section>
