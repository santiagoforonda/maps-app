<div #mapa class="h-[60vh]  sm:h-[calc(100vh-64px)]  ">
</div>

<section class="h-[40vh] sm:fixed sm:w-[320px] bg-white sm:rounded sm:top-20 sm:left-10 p-5 overflow-y-auto overflow-x-hidden box-border shadow-sm">
  <h2 class="text-xl font-bold text-black mb-2">Marcadores</h2>

  <div class="flex flex-col gap-2 p-1">

    @for(marker of markers();track marker.id){
      <div class="form-control p-2 rounded-md hover:bg-gray-100 cursor-pointer transition-colors" (click)="flyToMarker(marker.mapboxMarker.getLngLat())" (dblclick)="deleteMarker(marker)">
        <label class="label cursor-pointer flex items-center gap-3">
          <input
            type="radio" name="radio-12" checked="checked"
            class="radio" [style]="{backgroundColor:marker.mapboxMarker._color}"/>
          <span class="label-text text-black text-xs break-words text-wrap">Marcador {{marker.mapboxMarker.getLngLat() | json}}</span>

        </label>
      </div>

    }@empty {
      <div class="flex justify-center items-center bg-blue-100 rounded">
        <p class="text-xs text-secondary p-3">No hay marcadores</p>
      </div>
    }

  </div>
</section>
